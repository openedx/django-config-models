[tox]
envlist = py{312}-django{52}-drf{latest},quality,docs
requires = tox-uv>=1

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
ignore = D200,D203
match-dir = (?!migrations)

[testenv]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}/mock_apps
    DJANGO_SETTINGS_MODULE = test_settings
dependency_groups = test
allowlist_externals = make
commands =
    make test PYTEST_ARGS="{posargs}"
    python -m coverage html

[testenv:docs]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}/:{toxinidir}/mock_apps
dependency_groups = doc
allowlist_externals = make
commands =
    make docs BROWSER=true

[testenv:quality]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}/:{toxinidir}/mock_apps
dependency_groups = quality
allowlist_externals = make
commands =
    make quality

[testenv:check_keywords]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals = make
commands =
    make check_keywords
